<!DOCTYPE html>
<html translate="no" lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    
    <title>Sharkie</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="img/1.Sharkie/favicon.png">

    
    <script src="../models/drawable-object.class.js"></script>
    <script src="../models/movable-object.class.js"></script>
    <script src="../models/collectable-object.class.js"></script>
    <script src="../models/character.class.js"></script>
    <script src="../models/jelly-fish.class.js"></script>
    <script src="../models/puffer-fish.class.js"></script>
    <script src="../models/status-bar-energy.class.js"></script>
    <script src="../models/status-bar-coin.class.js"></script>
    <script src="../models/status-bar-poisson.js"></script>
    <script src="../models/status-bar-final.class.js"></script>
    <script src="../models/throwable-object.class.js"></script>
    <script src="../models/world.class.js"></script>
    <script src="../models/background-object.class.js"></script>    
    <script src="../models/keyboard.class.js"></script>
    <script src="../models/final-enemy.class.js"></script>
    <script src="../models/level.class.js"></script>
    
    <script src="../models/coin.class.js"></script>
    <script src="../levels/level1.js"></script>
    

    <script src="./js/game.js"></script> 
</head>

<body>
    <h1>Sharkie</h1>
    <canvas id="canvas" width="720" height="480"></canvas>
    <!-- Static Start Screen (shown by default) -->
    <div id="start-screen" class="visible background-blue">
        <div class="start-screen-box">
            <div class="game-over-content">Sharkie</div>
            <button id="start-button" onclick="hideStartScreen();">
                <img src="img/6.Botones/Start/2.png" alt="Start">
            </button>
        </div>
    </div>
    <!-- Static Game Over overlay (shown via CSS class) -->
    <div id="game-over-overlay" class="hidden">
        <div class="game-over-box hidden">
            <div class="game-over-content">game over</div>
            <button id="try-again-button" class="hidden">
                <img src="img/6.Botones/Try again/Recurso 17.png" alt="Try again">
            </button>
        </div>
    </div>
    <!-- Static You Win overlay (shown when final enemy defeated) -->
    <div id="you-win-overlay" class="hidden">
        <div class="you-win-box hidden">
            <div class="game-over-content">you win</div>
            <button id="play-again-button" class="hidden">
                <img src="img/6.Botones/Try again/Recurso 17.png" alt="Play again">
            </button>
        </div>
    </div>
</body>
</html>
